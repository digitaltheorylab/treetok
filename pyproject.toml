[project]
authors = [{name = "Tyler Shoemaker", email = "69219954+t-shoemaker@users.noreply.github.com"}]
dependencies = [
    "transformers>=5.0,<6.0",
    "numpy>=2.0,<3",
    "rapidfuzz>=3.14,<4",
    "xgboost>=2.1,<3",
    "pyarrow>=17.0", "sentencepiece>=0.2.1,<0.3", "tiktoken>=0.12.0,<0.13",
]
name = "treetok"
requires-python = ">= 3.11"
version = "0.2.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
# OpenMP runtime required by the xgboost wheel on macOS (libomp.dylib)
llvm-openmp = "*"

[tool.pixi.pypi-dependencies]
treetok = { path = ".", editable = true }

[tool.pixi.tasks]
grid-model = { cmd = ["python", "scripts/grid_search.py"], description = "Grid-search dataset/training config and score on OOD tokenizer" }
train-model = { cmd = ["zsh", "scripts/train.sh"], description = "Train default model" }
test-model = { cmd = ["sh", "-c", "python -m treetok cluster Qwen/Qwen3-8B --classifier data/model.json 2>&1 | head -n 50"], description = "Test model on an OOD tokenizer" }
